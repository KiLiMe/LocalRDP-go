name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Format
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) {
            Write-Host "gofmt would rewrite:"
            $out | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Build
        run: go tool mygo build -platform windows/amd64 -skip-installer -skip-dmg

      - name: Check the exe
        shell: pwsh
        run: |
          $exe = 'build/windows-amd64/localrdp.exe'
          if (-not (Test-Path $exe)) { throw "mygo build produced no $exe" }
          $want = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $got = (Get-Item $exe).VersionInfo.FileVersion
          if ($got -ne $want) { throw "exe says $got, mygo.json says $want" }
          # 图形子系统程序的 $LASTEXITCODE 不稳，用 Start-Process 等它退并拿 ExitCode。
          $p = Start-Process -FilePath $exe -ArgumentList 'help' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "$exe help exited $($p.ExitCode)" }
