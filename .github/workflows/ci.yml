name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 连推几次时不再排队等前一次跑完：同分支/同 tag 上后来的一次起来就取消旧的。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 这里只查代码：vet / gofmt / 测试 / 能不能链接。
# 图标、版本信息、manifest 是 mygo 打包时注入的，验它们要花 30 秒——那部分只在 tag 上做，见 release。
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Format
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) {
            Write-Host "gofmt would rewrite:"
            $out | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: Test
        run: go test ./...

      # 只验链接得上，产物丢掉：不带图标与版本信息，不是发布件。
      - name: Build (link only)
        shell: pwsh
        run: go build -o "${{ runner.temp }}\localrdp.exe" .

  # 同一个 workflow：普通 push 与 PR 只跑上面那个 job，推 v* tag 才多跑这一个。
  # 上面的 job 已经 vet / gofmt / 测过同一个提交，这里只管打包、验 exe 与发布。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write        # 建 Release 要写权限，顶层只给 read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 要上一个 tag 才画得出「这个版本的变化」

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tag 去掉 v 就是版本号。-Version 是断言模式：mygo.json 里不是这一串就直接失败，
      # 免得 tag 与 exe 属性里的版本错位。
      - name: Package
        shell: pwsh
        run: pwsh .\Scripts\build.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)

      # build.ps1 已经对账过 exe 属性里的版本；这里再确认它能跑起来。
      - name: Check the exe
        shell: pwsh
        run: |
          $exe = 'build/windows-amd64/localrdp.exe'
          if (-not (Test-Path $exe)) { throw "build produced no $exe" }
          # 图形子系统程序的 $LASTEXITCODE 不稳，用 Start-Process 等它退并拿 ExitCode。
          $p = Start-Process -FilePath $exe -ArgumentList 'help' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "$exe help exited $($p.ExitCode)" }

      # 说明 = 每版都一样的固定前言（怎么下、怎么跑、首次使用）+ 上一个 tag 以来的提交 + 校验值。
      # 固定前言写在这里，发版时不用手写；需要特别介绍时之后再 `gh release edit --notes-file`。
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.Substring(1)
          $exe = 'build/windows-amd64/localrdp.exe'
          $zip = "build/localrdp-$ver-windows-amd64.zip"
          if (-not (Test-Path $exe)) { throw "build produced no $exe" }
          if (-not (Test-Path $zip)) { throw "build produced no $zip" }

          # 「chore: 版本 x.y.z」是发版那一下的提交，读者已经知道，不列进变化。
          $skip = '^- chore: 版本 '
          $prev = git describe --tags --abbrev=0 "$tag^"
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $range = "（$prev..$tag）"
            $lines = @(git log "$prev..$tag" --pretty=format:'- %s')
          } else {
            $range = ''
            $lines = @(git log $tag --pretty=format:'- %s')
          }
          $changes = @($lines | Where-Object { $_ -notmatch $skip }) -join "`n"
          if (-not $changes) { $changes = '（只有版本号）' }
          $exeSha = (Get-FileHash $exe -Algorithm SHA256).Hash
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash

          $notes = @"
          在 Windows 上开一个**子会话**（第二张桌面）当远程桌面用：不接管物理屏幕，也不开 RDP 端口。

          ## 下载

          - ``localrdp.exe`` — 单文件 10 MB 左右，不依赖 VC 运行时，也不需要装 Go。
          - ``localrdp-$ver-windows-amd64.zip`` — 同一个 exe 连同 ``LICENSE``。

          ## 运行

          - 双击 = 图形界面；命令行 ``localrdp status``、``desktop``、``start <程序>``、``stop``、``click <按钮>``、``mcp``，
            完整清单见仓库的 ``docs/使用说明.md``。
          - 需要 Windows 10 / 11 **专业版**；首次运行会打开系统的子会话开关，需要点一次 UAC。
          - ``start`` 模式还要两项账户特权（``SeTcbPrivilege``、``SeAssignPrimaryTokenPrivilege``），见 ``docs/手动授予特权.md``。

          ## 这个版本的变化$range

          $changes

          ## 校验

          ``````
          exe  $exeSha
          zip  $zipSha
          ``````
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

          gh release create $tag $exe $zip --title "LocalRDP $tag" --notes-file $notesPath
