name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Format
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) {
            Write-Host "gofmt would rewrite:"
            $out | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Build
        run: go tool mygo build -platform windows/amd64 -skip-installer -skip-dmg

      - name: Check the exe
        shell: pwsh
        run: |
          $exe = 'build/windows-amd64/localrdp.exe'
          if (-not (Test-Path $exe)) { throw "mygo build produced no $exe" }
          $want = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $got = (Get-Item $exe).VersionInfo.FileVersion
          if ($got -ne $want) { throw "exe says $got, mygo.json says $want" }
          # 图形子系统程序的 $LASTEXITCODE 不稳，用 Start-Process 等它退并拿 ExitCode。
          $p = Start-Process -FilePath $exe -ArgumentList 'help' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "$exe help exited $($p.ExitCode)" }

  # 同一个 workflow：普通 push 与 PR 只跑上面那个 job，推 v* tag 才多跑这一个。
  # 上面的 job 已经 vet / gofmt / 测过同一个提交，这里只管打包与发布。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write        # 建 Release 要写权限，顶层只给 read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tag 去掉 v 就是版本号。-Version 是断言模式：mygo.json 里不是这一串就直接失败，
      # 免得 tag 与 exe 属性里的版本错位。
      - name: Package
        shell: pwsh
        run: pwsh .\Scripts\build.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.Substring(1)
          $exe = 'build/windows-amd64/localrdp.exe'
          $zip = "build/localrdp-$ver-windows-amd64.zip"
          if (-not (Test-Path $exe)) { throw "build produced no $exe" }
          if (-not (Test-Path $zip)) { throw "build produced no $zip" }
          gh release create $tag $exe $zip --title "LocalRDP $tag" --generate-notes
