name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Format
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) {
            Write-Host "gofmt would rewrite:"
            $out | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags '-s -w' -o build/bin/Release/localrdp.exe .
